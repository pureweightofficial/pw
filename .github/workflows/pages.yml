name: Deploy preview to GitHub Pages

# A STATIC PREVIEW, not the production site.
#
# GitHub Pages serves files, not functions. That used to matter a great deal: the
# valuation form needed a POST route, `output: 'export'` refuses to build one, and
# this workflow deleted the route before building so the export would succeed.
#
# That is all gone. The business trades over the counter, so the form and its
# endpoint were removed entirely and the export is now an ordinary build with no
# source surgery in CI.
#
# One server-shaped thing remains a Pages limitation: response headers. The CSP
# and the immutable asset caching in next.config.ts are only applied by a node
# host. See docs/GO-LIVE.md before choosing where production lives.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily 06:00 UTC rebuild — this is the scheduled-publishing mechanism.
  # publishedArticles() excludes articles dated in the future, so an article
  # the owner dates for next Tuesday is simply absent until Tuesday's cron
  # rebuild includes it. No server, no queue: the calendar is the scheduler.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; never cancel one midway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Quality gates run before anything is published: types, lint, the 3D
      # geometry audit and the WCAG contrast audit.
      - name: Verify
        run: npm run verify

      # The API route used to be deleted here, because output:'export' refuses to
      # build a POST handler. The valuation form and its route are gone — this
      # trade happens at the counter — so the export is now an ordinary build with
      # no source surgery in CI.

      # THE PRODUCTION TARGET, BUILT FIRST — and it is not the one this
      # workflow deploys.
      #
      # Everything below builds the GitHub Pages EXPORT. Production is Vercel,
      # which runs the node target, and the two configurations genuinely
      # differ: next.config.ts skips its entire `headers()` block when
      # GITHUB_PAGES is set (a static host cannot send headers), uses a
      # basePath, and turns the image optimiser off. So the CSP, every
      # Cache-Control rule, and the image pipeline were never once exercised
      # by CI.
      #
      # That is not hypothetical. A caching fix landed with an invalid route
      # pattern — `/_next/image:path*`, which throws "Can not repeat 'path'
      # without a prefix and suffix". It broke the production build outright
      # and this workflow would have gone green, because the block containing
      # it is not compiled on Pages.
      #
      # One extra step, no extra checkout or install, and the build Vercel
      # actually runs now has to compile before anything is published.
      - name: Build production target (the one Vercel runs)
        env:
          NEXT_PUBLIC_SITE_URL: 'https://pureweight.gold'
          NEXT_PUBLIC_ALLOW_INDEXING: 'false'
        run: npm run build

      - name: Build static export
        env:
          GITHUB_PAGES: 'true'
          # Canonical URLs and OG tags point at the Pages origin.
          NEXT_PUBLIC_SITE_URL: 'https://pureweightofficial.github.io/pw'
          # Indexing stays off. This is an unfinished preview carrying a real
          # business's name, and it must not be indexed under any circumstances.
          NEXT_PUBLIC_ALLOW_INDEXING: 'false'
        run: npm run build

      # The accessibility gates audit the EXPORTED site in a real browser, so
      # they can only run once the export exists. They were briefly part of
      # `verify` above and broke this workflow immediately: `verify` runs before
      # the build, so out/ was not there yet. Gates that need artefacts belong
      # after the artefacts, which is the whole reason `verify:built` exists.
      #
      # The runner image ships Google Chrome at /usr/bin/google-chrome, which is
      # what these scripts look for. They fail loudly rather than skipping when
      # no browser is found, so this step can never quietly do nothing.
      - name: Verify the built site (accessibility)
        run: npm run verify:built

      # Stops Pages' Jekyll pipeline from eating the _next directory.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
