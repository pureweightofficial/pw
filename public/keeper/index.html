<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      THE KEEPER — Pureweight's admin panel.

      A vendored copy of Sveltia CMS (public/keeper/sveltia-cms.js, pinned at
      0.176.1, committed to the repo). Nothing here is fetched from a CDN: an
      admin panel that stops working because a third party moved a file is an
      admin panel the owner cannot trust. Re-vendor deliberately by bumping the
      exact-pinned devDependency and re-copying the dist file.

      There is no server. The owner signs in with a GitHub fine-grained access
      token (repo pureweightofficial/pw, Contents: read/write only) and every
      save is a commit to main made directly from this browser to
      api.github.com. The commit triggers the same GitHub Actions build as any
      push — including `npm run verify`, whose content gate refuses malformed
      or non-compliant content BEFORE it can publish. See docs/KEEPER.md.

      This page is publicly reachable — static hosting cannot gate a URL — but
      it holds no secrets: it is a login screen, and only a valid token with
      write access to the repo can change anything.
    -->
    <title>Pureweight Keeper</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <script src="./sveltia-cms.js" type="module"></script>
  </body>
</html>
