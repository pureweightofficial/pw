# THE KEEPER'S FIELD MAP — a hand-written mirror of src/lib/content-schema.ts.
#
# If a field is added there it must be added here, and vice versa;
# scripts/check-content.mjs fails the build when the two drift on business
# fields, so the mirror cannot rot silently.
#
# DELIBERATE ABSENCES — things the panel cannot do, by design:
#   - no "verified" switch anywhere. A field filled in becomes a fact; a field
#     left EMPTY renders as the site's visible placeholder. The placeholder
#     labels live in code the panel does not expose.
#   - service panels cannot be added, removed or retitled. Titles key the
#     engraved artwork and navigation; four fixed objects, not a list.
#   - the `confirmed` flags, navigation, chapters, journey, pillars and all
#     legal copy stay in code. Changing those is a design decision, and the
#     developer is the right person to make it survivable.

backend:
  name: github
  repo: pureweightofficial/pw
  branch: main
  # No OAuth app and no proxy: the owner signs in with a fine-grained personal
  # access token scoped to this one repository, entered on the login screen.
  # Sveltia stores it in this browser only and talks straight to api.github.com.
  #
  # `auth_methods: [token]` removes the "Sign In with GitHub" OAuth button
  # entirely. Without it, Sveltia shows that button anyway and falls back to
  # Netlify's public auth endpoint, which pops a dead "Not Found" window here —
  # the owner clicked it within a minute of first seeing the panel, which is
  # proof enough that a broken button is a trap, not an option. Token sign-in
  # is the only path that works on this stack, so it is the only one shown.
  auth_methods: [token]

# Media the owner uploads lands in the repo and ships with the next build.
# public_folder is REPO-RELATIVE ('/img', never '/pw/img'): src/lib/asset.ts
# adds the deployment prefix at render time, and hardcoding it here would
# double the path the day the site moves to its own domain.
media_folder: public/img
public_folder: /img

site_url: https://pureweightofficial.github.io/pw
display_url: https://pureweightofficial.github.io/pw

collections:
  - name: business
    label: Business Details
    description: >-
      Fill a field in and it appears on the site as fact. Leave a field empty
      and the site shows a visible "[INSERT …]" slot instead — honest about
      what has not been confirmed yet. Insurance and the review score also
      need their issuer/source filled in before they will show.
    editor:
      preview: false
    files:
      - name: facts
        label: Business Facts
        file: src/content/business.json
        format: json
        fields:
          - { name: legalName, label: Registered legal name, widget: string, required: false }
          - { name: registrationNumber, label: Business registration number, widget: string, required: false }
          - { name: vatNumber, label: VAT / tax number, widget: string, required: false }
          - { name: yearEstablished, label: Year established, widget: string, required: false, hint: "Four digits, e.g. 1998" }
          - { name: address, label: Trading address, widget: string, required: false }
          - { name: serviceArea, label: Service area, widget: string, required: false }
          - { name: telephone, label: Telephone, widget: string, required: false, hint: "Shown on the site and dialable from phones — digits and separators only" }
          - { name: email, label: Enquiry email, widget: string, required: false }
          - { name: openingHours, label: Opening hours, widget: string, required: false, hint: "e.g. Mon–Fri 9:30–17:30, Sat 10:00–14:00" }
          - { name: appointmentProcess, label: Appointment process, widget: text, required: false }
          - { name: settlementMethods, label: Settlement / payment methods, widget: string, required: false }
          - { name: priceReferenceSource, label: Gold-price reference source, widget: string, required: false }
          - { name: insurance, label: Insurance, widget: string, required: false, hint: "Also fill in the insurer below, or this stays a placeholder" }
          - { name: insuranceIssuer, label: Insurance — issuer, widget: string, required: false }
          - { name: memberships, label: Professional memberships, widget: string, required: false }
          - { name: certifications, label: Certifications, widget: string, required: false }
          - { name: licences, label: Licences, widget: string, required: false }
          - { name: securityProcedures, label: Security procedures, widget: text, required: false }
          - { name: weighingEquipment, label: Weighing / assay equipment, widget: string, required: false }
          - { name: reviewScore, label: Customer review score, widget: string, required: false, hint: "Also fill in the source below, or this stays a placeholder" }
          - { name: reviewScoreSource, label: Review score — source URL, widget: string, required: false }
          - { name: founderMessage, label: Founder message, widget: text, required: false }
          - { name: foundingStory, label: Founding story, widget: text, required: false }
          - { name: social, label: Social channels, widget: list, required: false, field: { name: url, label: Profile URL, widget: string, hint: "Full https:// address" } }

  - name: services
    label: What We Buy
    description: >-
      The four buying panels. The wording and pictures are yours to change;
      the panels themselves and their titles are fixed. Every picture needs a
      short description (what a screen reader says out loud) — saving without
      one will not publish.
    editor:
      preview: false
    files:
      - name: panels
        label: Service Panels
        file: src/content/services.json
        format: json
        fields:
          - name: jewellery
            label: Gold Jewellery
            widget: object
            fields: &service_fields
              - { name: summary, label: One-line summary, widget: string }
              - { name: body, label: Description, widget: text }
              - { name: points, label: Bullet points, widget: list, field: { name: point, label: Point, widget: string } }
              - { name: image, label: Photo, widget: image, required: false, hint: "No identifiable people, no branded or serial-numbered bullion, no third-party premises — see public/img/CREDITS.md" }
              - { name: imageAlt, label: Photo description, widget: string, required: false, hint: "One sentence describing the photo, required whenever a photo is set" }
          - name: silver
            label: Silver
            widget: object
            fields: *service_fields
          - name: coins
            label: Coins
            widget: object
            fields: *service_fields
          - name: bullion
            label: Bars & Bullion
            widget: object
            fields: *service_fields

  - name: testimonials
    label: Testimonials
    description: >-
      Real customer words only, with the customer's name and context — the
      site refuses anonymous or half-attributed quotes, and it also refuses
      quotes containing promises the business has not verified (prices,
      timescales, guarantees), even when a customer genuinely said them.
    editor:
      preview: false
    files:
      - name: quotes
        label: Customer Quotes
        file: src/content/testimonials.json
        format: json
        fields:
          - name: testimonials
            label: Testimonials
            widget: list
            required: false
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: name, label: Customer name, widget: string }
              - { name: context, label: Context, widget: string, hint: "e.g. Sold a gold chain, June 2026" }
